<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>經典泡泡龍 - Puzzle Bobble HTML5</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game-container">
    <!-- Header HUD -->
    <header class="game-header">
      <div class="title-badge">
        <h1>泡泡龍</h1>
        <span class="level-tag" id="levelName">第 1 關</span>
      </div>
      <div class="score-stats">
        <div class="stat-box">
          <div class="stat-label">SCORE</div>
          <div class="stat-value" id="currentScore">0</div>
        </div>
        <div class="stat-box high-score">
          <div class="stat-label">BEST</div>
          <div class="stat-value" id="highScore">0</div>
        </div>
      </div>
    </header>

    <!-- Canvas Game Area -->
    <main class="canvas-wrapper">
      <canvas id="gameCanvas" width="440" height="660"></canvas>
    </main>

    <!-- Control Actions -->
    <section class="control-bar">
      <button class="btn btn-primary" id="btnSwap" title="切換待命泡泡 (快捷鍵: 空白鍵 / 右鍵)">
        <span>⇄ 換球</span>
      </button>
      <button class="btn" id="btnMode" title="切換關卡或無盡模式">
        <span>🕹️ 無盡模式</span>
      </button>
      <button class="btn" id="btnRestart" title="重新開始此關">
        <span>🔄 重來</span>
      </button>
      <button class="btn" id="btnMute" title="開關音效">
        <span>🔊 音效</span>
      </button>
    </section>

    <!-- Keyboard & Touch Instructions -->
    <footer class="instructions-footer">
      <span><kbd>滑鼠 / 觸控</kbd> 瞄準與發射</span>
      <span><kbd>空白鍵 / 右鍵</kbd> 交換泡泡</span>
      <span><kbd>← →</kbd> 微調角度</span>
    </footer>

    <!-- Start / Welcome Modal -->
    <div class="modal active" id="startModal">
      <div class="modal-content">
        <div class="modal-icon">🔮</div>
        <h2 class="modal-title">經典泡泡龍</h2>
        <p class="modal-desc">連鎖爆破、精準反彈、挑戰最高分！</p>
        
        <ul class="guide-list">
          <li><strong>三色連鎖</strong>：發射泡泡連接 3 顆以上相同顏色即可消除。</li>
          <li><strong>懸空掉落</strong>：擊碎上方支撐點，讓下方的孤立泡泡整片墜落獲得高額獎勵！</li>
          <li><strong>天花板警報</strong>：若連續未消除泡泡，天花板將持續向下壓迫。</li>
          <li><strong>警戒死亡線</strong>：泡泡不可觸碰到底部紅虛線！</li>
        </ul>

        <div class="modal-buttons">
          <button class="btn btn-primary btn-start-game">🚀 開始遊戲</button>
        </div>
      </div>
    </div>

    <!-- Victory Modal -->
    <div class="modal" id="victoryModal">
      <div class="modal-content">
        <div class="modal-icon">🎉</div>
        <h2 class="modal-title victory">關卡完成！</h2>
        <p class="modal-desc">太棒了！所有泡泡都被你徹底清除了！</p>
        
        <div class="modal-score-box">
          <div class="label">當前總分</div>
          <div class="final-score">0</div>
        </div>

        <div class="modal-buttons">
          <button class="btn btn-primary btn-next-level">下一關 ➔</button>
          <button class="btn btn-retry">重新挑戰此關</button>
        </div>
      </div>
    </div>

    <!-- Game Over Modal -->
    <div class="modal" id="gameOverModal">
      <div class="modal-content">
        <div class="modal-icon">💥</div>
        <h2 class="modal-title gameover">GAME OVER</h2>
        <p class="modal-desc">泡泡越過死亡警戒線了！</p>
        
        <div class="modal-score-box">
          <div class="label">最終得分</div>
          <div class="final-score">0</div>
        </div>

        <div class="modal-buttons">
          <button class="btn btn-danger btn-retry">🔄 再玩一次</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Game Scripts -->
  <script src="js/audio.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/cannon.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
